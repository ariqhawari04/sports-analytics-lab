
[theme]
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#EAF0F7"
textColor = "#0F172A"
borderColor = "#DCE4ED"

font = "sans-serif"
headingFont = "sans-serif"

baseFontSize = 18
baseFontWeight = 450
headingFontSizes = ["3rem", "2.1rem", "1.6rem"]
headingFontWeights = [800, 750, 700]

metricValueFontSize = "2.25rem"
metricValueFontWeight = 700
baseRadius = "0.75rem"

[theme.sidebar]
backgroundColor = "#F1F5F9"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
