
name: SAL Multi-League CI

on:
  push:
    branches:
      - feature/multi-league

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  multi-league-tests:
    name: Multi-League Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-etl.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-etl.txt

      - name: Check Python syntax
        run: |
          python -m compileall -q src/analysis
          python -m compileall -q src/processing
          python -m py_compile app/app.py
          python -m py_compile tests/test_multi_league.py

      - name: Build historical multi-league dataset
        run: |
          python -m src.processing.build_multi_league_preview

      - name: Run multi-league regression tests
        run: |
          python -m unittest discover -s tests -p "test_multi_league.py" -v

      - name: Run EPL standings regression test
        run: |
          PYTHONPATH=. python tests/test_standings.py
