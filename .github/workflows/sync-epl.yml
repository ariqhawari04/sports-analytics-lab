name: Sync EPL Results

on:
  schedule:
    # Runs in UTC.
    # 09:23, 15:23, 21:23, 03:23 WIB
    - cron: "23 2,8,14,20 * * *"

  # Allow manual execution from GitHub.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sal-epl-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-etl.txt

      - name: Install dependencies
        run: pip install -r requirements-etl.txt

      - name: Sync EPL matches
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python -m src.processing.sync_current_season --apply
